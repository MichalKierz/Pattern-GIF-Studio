[package]
name = "pattern-gif-studio"
version = "0.1.0"
edition = "2024"
description = "Portable desktop studio for seamless procedural pattern GIF loops."
publish = false

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
eframe = { version = "0.34", features = ["glow"] }
egui = "0.34"
gif = "0.13"
pollster = "0.4"
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "29"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = "symbols"
